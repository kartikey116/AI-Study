name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:
    inputs:
      run_guardrails:
        description: 'Also run the AI red-team suite (real Gemini calls, needs GOOGLE_GENERATIVE_AI_API_KEY secret)'
        type: boolean
        default: false

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p .
      - run: npm run build

  isolation:
    name: Tenant isolation suite
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: studyai }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyai
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studyai
      # The suite makes no AI or storage calls; these only satisfy startup checks
      SUPABASE_URL: https://ci.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-0000
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: echo 'CREATE EXTENSION IF NOT EXISTS vector;' | npx prisma db execute --stdin --url "$DATABASE_URL"
      - run: npm run prisma:push
      - run: npm run test:isolation

  guardrails:
    name: AI guardrail red-team suite
    runs-on: ubuntu-latest
    needs: isolation
    if: github.event_name == 'workflow_dispatch' && inputs.run_guardrails
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: studyai }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyai
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studyai
      SUPABASE_URL: https://ci.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-0000
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: echo 'CREATE EXTENSION IF NOT EXISTS vector;' | npx prisma db execute --stdin --url "$DATABASE_URL"
      - run: npm run prisma:push
      - run: npm run test:guardrails
